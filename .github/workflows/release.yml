name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "no KEYSTORE_BASE64 secret — the APK would be unsigned"; exit 1; fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build the signed APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # The signing config reads a path relative to the project root.
          cp "$RUNNER_TEMP/release.jks" ./release.jks
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleRelease
          ls -l app/build/outputs/apk/release/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tiktok_logger-android-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
      - name: Create the release or attach to it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/release/*.apk --clobber
          else
            gh release create "$TAG" app/build/outputs/apk/release/*.apk --verify-tag \
              --title "tiktok_logger for Android ${TAG#v}" \
              --notes "Built from \`${TAG}\`. Signed release APK attached; see README.md for what is in it."
          fi
